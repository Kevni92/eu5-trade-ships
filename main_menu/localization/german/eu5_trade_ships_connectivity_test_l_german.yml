l_german:
 eu5_trade_ships_connectivity_test.1.title: "Trade Ships - Connectivity Runtime Test"
 eu5_trade_ships_connectivity_test.1.desc: "Diese Debug-Kette testet zwei Location-Connectivity-Trigger. Auf jedem Testbildschirm sollte genau eine Ergebnis-Schaltfläche sichtbar sein. Notiere deren Text."
 eu5_trade_ships_connectivity_test.1.a: "Fünf Tests starten"

 eu5_trade_ships_connectivity_test.2.title: "Test 1/5 - London nach Oxford"
 eu5_trade_ships_connectivity_test.2.desc: "Kontrollfall: Landverbindung innerhalb Englands. Notiere die sichtbare Ergebnis-Schaltfläche."
 eu5_trade_ships_connectivity_test.3.title: "Test 2/5 - Kopenhagen nach Malmö"
 eu5_trade_ships_connectivity_test.3.desc: "Test über den Öresund beziehungsweise eine Meerenge. Notiere die sichtbare Ergebnis-Schaltfläche."
 eu5_trade_ships_connectivity_test.4.title: "Test 3/5 - Paris nach Madrid"
 eu5_trade_ships_connectivity_test.4.desc: "Internationaler kontinentaler Landtest. Notiere die sichtbare Ergebnis-Schaltfläche."
 eu5_trade_ships_connectivity_test.5.title: "Test 4/5 - Rom nach Neapel"
 eu5_trade_ships_connectivity_test.5.desc: "Zweiter internationaler kontinentaler Landtest. Notiere die sichtbare Ergebnis-Schaltfläche."
 eu5_trade_ships_connectivity_test.6.title: "Test 5/5 - London nach Paris"
 eu5_trade_ships_connectivity_test.6.desc: "Test der Trennung durch den Ärmelkanal. Notiere die sichtbare Ergebnis-Schaltfläche."

 eu5_trade_ships_connectivity_test.result.yy: "ERGEBNIS: GENERAL JA / REALM JA"
 eu5_trade_ships_connectivity_test.result.yn: "ERGEBNIS: GENERAL JA / REALM NEIN"
 eu5_trade_ships_connectivity_test.result.ny: "ERGEBNIS: GENERAL NEIN / REALM JA"
 eu5_trade_ships_connectivity_test.result.nn: "ERGEBNIS: GENERAL NEIN / REALM NEIN"

 eu5_trade_ships_connectivity_test.7.title: "Connectivity-Test abgeschlossen"
 eu5_trade_ships_connectivity_test.7.desc: "Bitte melde die fünf Ergebnispaarungen in dieser Reihenfolge: London-Oxford, Kopenhagen-Malmö, Paris-Madrid, Rom-Neapel, London-Paris."
 eu5_trade_ships_connectivity_test.7.a: "Beenden"
